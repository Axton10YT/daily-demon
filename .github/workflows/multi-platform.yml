name: Build Binaries

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          # macOS and iOS are left out until the 2.2091 bindings have addresses for the hooked
          # DailyLevelPage / GameLevelManager functions on those platforms.
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      # Argon v2 is a Geode mod that isn't on the index yet: build and install it locally first
      # so the dependency check and linking for our mod can find it.
      - name: Checkout Argon v2
        uses: actions/checkout@v4
        with:
          repository: GlobedGD/argon
          ref: v2
          path: argon-src
      - name: Patch Argon v2 include order
        shell: bash
        # Upstream bug on the v2 branch: Challenge.hpp calls getArgonServerUrl (Overrides.hpp) without including it.
        run: perl -0pi -e 's|#include "Web.hpp"|#include "Web.hpp"\n#include "Overrides.hpp"|' argon-src/src/Challenge.hpp
      - name: Build Argon v2
        uses: geode-sdk/build-geode-mod@main
        with:
          path: argon-src
          sdk: nightly
          bindings: geode-sdk/bindings
          bindings-ref: main
          target: ${{ matrix.config.target }}
      - name: Stop sccache between the two builds
        shell: bash
        # a second build-geode-mod run in the same job fails with "Address in use" if the first server is still up
        run: |
          sccache --stop-server || true
          # the action unpacks ninja/the CLI into the workspace; 7z would prompt to overwrite on the second run
          rm -rf ninja ninja.zip my-epic-geode-cli geode-sdk-clone output
          # forget the CLI's profile registration (it would refuse to add it again) but keep cli-profile/, which holds the installed Argon
          rm -rf "$HOME/.local/share/Geode" "$HOME/Library/Application Support/Geode" "${LOCALAPPDATA:-/nonexistent}/Geode"
      - name: Install Argon v2 for the mod build
        shell: bash
        # build-geode-mod packages mods without installing them, so put the .geode where the dependency check looks
        run: |
          mkdir -p cli-profile/geode/mods
          cp argon-src/build/dankmeme.argon.geode cli-profile/geode/mods/
          ls -la cli-profile/geode/mods
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    # Package whatever built, even if one platform (e.g. iOS) failed.
    if: ${{ !cancelled() }}
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
