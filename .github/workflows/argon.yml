name: Build Argon v2 (dependency)

# Argon v2 isn't on the Geode index yet, so this builds a combined dankmeme.argon.geode
# (Windows + Android) that can be dropped into the mods folder next to Hourly Level.
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/argon.yml"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - name: Checkout Argon v2
        uses: actions/checkout@v4
        with:
          repository: GlobedGD/argon
          ref: v2
      - name: Patch Argon v2 include order
        shell: bash
        # Upstream bug on the v2 branch: Challenge.hpp calls getArgonServerUrl (Overrides.hpp) without including it.
        run: perl -0pi -e 's|#include "Web.hpp"|#include "Web.hpp"\n#include "Overrides.hpp"|' src/Challenge.hpp
      - name: Build Argon v2
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          bindings: geode-sdk/bindings
          bindings-ref: main
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    if: ${{ !cancelled() }}
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
      - uses: actions/upload-artifact@v4
        with:
          name: Argon v2
          path: ${{ steps.build.outputs.build-output }}
